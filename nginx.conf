server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Security headers (ver el comentario dentro del archivo)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression for better performance.
    # gzip_comp_level por defecto es 1 (compresion minima). Con 6 el CSS global
    # baja de forma notable a cambio de una CPU despreciable, y las respuestas
    # ya comprimidas se cachean por el proxy de delante gracias a gzip_vary.
    # Las fuentes woff2 ya vienen comprimidas: no se listan a proposito.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Universal Links de iOS: Apple descarga este archivo (sin extensión) para
    # saber qué rutas abre la app. Debe servirse como JSON, sin redirecciones y
    # sin caché larga (un cambio de rutas tiene que verse pronto).
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Worker de MapLibre (/maplibre/maplibre-gl-worker.mjs). El mime.types de algunas
    # versiones de nginx no conoce .mjs y lo sirve como application/octet-stream; con
    # nosniff el navegador se niega a ejecutarlo como módulo y el mapa propio se queda
    # sin calles ni etiquetas (solo se ve el fondo y los polígonos de Leaflet).
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Cache static assets aggressively (Angular hashes filenames on build)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # HTML shell must always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Serve Angular App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API pública de integraciones. Va ANTES de /api/ y sin rewrite: el
    # backend monta este contrato en /api/v1, así que la ruta debe llegarle
    # intacta. De este modo /api/v1/... es la misma URL para el sistema
    # externo y para el panel, en desarrollo y en producción.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ver la nota de tiempos y buffers del bloque /api/ de abajo.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Proxy API requests to the backend
    # Subidas que sí superan los 20m. Van en su propia location EXACTA para que el
    # resto de /api/ (incluidas las rutas públicas sin sesión) no acepte cuerpos de
    # 100 MB: FastAPI los leía enteros en memoria antes de comprobar el token.
    #  · .jwpub del S-34 (catálogo de discursos públicos), unos 72 MB. Solo Administrador.
    #  · restauración de un respaldo (.dump/.sql) subido a mano. Solo Administrador.
    location = /api/discursos/catalogo/importar {
        rewrite ^/api/(.*) /$1 break;
        client_max_body_size 100m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 10s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /api/config/backup/restaurar/upload {
        rewrite ^/api/(.*) /$1 break;
        client_max_body_size 100m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 10s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        # Check if we need to rewrite /api prefix or keep it.
        # Based on previous code, the backend runs on / so we might need rewrite if frontend calls /api/foo
        # and backend expects /foo.
        # Let's assume standardized /api prefix for proxying but strip it for backend if backend doesn't handle /api group.
        # The backend main.py showed routes like /usuarios/ so stripping /api is likely needed.
        rewrite ^/api/(.*) /$1 break;

        # Tope general de cuerpo para /api/. Las dos subidas que necesitan 100m
        # (el .jwpub del S-34 y la restauración de un respaldo) tienen su propia
        # location exacta más arriba.
        client_max_body_size 20m;


        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Los 60s por defecto se quedaban cortos para las generaciones de PDF y
        # de Excel del modulo de secretario, y los buffers pequenos obligaban a
        # nginx a volcar a disco las respuestas grandes.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
