server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Gzip compression for better performance.
    # gzip_comp_level por defecto es 1 (compresion minima). Con 6 el CSS global
    # baja de forma notable a cambio de una CPU despreciable, y las respuestas
    # ya comprimidas se cachean por el proxy de delante gracias a gzip_vary.
    # Las fuentes woff2 ya vienen comprimidas: no se listan a proposito.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets aggressively (Angular hashes filenames on build)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML shell must always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Serve Angular App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API pública de integraciones. Va ANTES de /api/ y sin rewrite: el
    # backend monta este contrato en /api/v1, así que la ruta debe llegarle
    # intacta. De este modo /api/v1/... es la misma URL para el sistema
    # externo y para el panel, en desarrollo y en producción.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ver la nota de tiempos y buffers del bloque /api/ de abajo.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Proxy API requests to the backend
    location /api/ {
        # Check if we need to rewrite /api prefix or keep it.
        # Based on previous code, the backend runs on / so we might need rewrite if frontend calls /api/foo
        # and backend expects /foo.
        # Let's assume standardized /api prefix for proxying but strip it for backend if backend doesn't handle /api group.
        # The backend main.py showed routes like /usuarios/ so stripping /api is likely needed.
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Los 60s por defecto se quedaban cortos para las generaciones de PDF y
        # de Excel del modulo de secretario, y los buffers pequenos obligaban a
        # nginx a volcar a disco las respuestas grandes.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
