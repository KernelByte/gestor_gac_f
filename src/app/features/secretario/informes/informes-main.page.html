<div class="flex flex-col gap-3 h-full overflow-hidden p-1 print:!overflow-visible print:!p-0 print:!h-auto">
   <!-- Template de los Tabs para usarlos dinámicamente -->
   <ng-template #tabsNav>
      <div role="tablist" aria-label="Secciones de informes" class="tab-nav tab-compact shrink-0 w-full">
         <button type="button" role="tab" *ngFor="let tab of visibleTabs()" (click)="tryChangeTab(tab.id)"
            [attr.aria-selected]="activeTab() === tab.id"
            class="flex-1 min-w-0 justify-center" [ngClass]="activeTab() === tab.id ? 'tab-item-active' : 'tab-item'">
            <span class="shrink-0 flex items-center justify-center w-3.5 h-3.5" aria-hidden="true">
               <svg *ngIf="tab.id === 'entrada'" class="w-full h-full" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
               </svg>
               <svg *ngIf="tab.id === 'historial'" class="w-full h-full" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
               </svg>
               <svg *ngIf="tab.id === 'sucursal'" class="w-full h-full" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                     d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
               </svg>
            </span>
            <span class="truncate">{{ tab.label.split(' ')[0] }}</span>
         </button>
      </div>
   </ng-template>

   <!-- Header Area: Tabs + Stats (Solo Visible arriba si NO estamos en historial) -->
   <div *ngIf="activeTab() !== 'historial'" class="print:hidden flex flex-col sm:flex-row sm:items-start gap-3">
      <!-- Render original de Tabs Navigation si no es historial -->
      <div class="w-full sm:w-[22rem] xl:w-[27rem] shrink-0">
         <ng-container *ngTemplateOutlet="tabsNav"></ng-container>
      </div>
      <!-- Unified Filters & Stats (Solo en Entrada Mensual) -->
      <div *ngIf="activeTab() === 'entrada'" class="flex-1 min-w-0 max-w-full overflow-visible relative z-20">
         <app-informes-filters [resumen]="filteredResumen()" [activeDropdown]="activeDropdown()"
            [isRestrictedUser]="isRestrictedUser()" [selectedMes]="selectedMes ?? ''" [selectedAno]="selectedAno ?? ''"
            [selectedGrupo]="selectedGrupo" [meses]="meses" [anos]="anos" [grupos]="grupos()"
            [vistaGrupo]="vistaGrupo()" [searchQuery]="searchQuery" [soloSinInforme]="soloSinInforme"
            (toggleDropdown)="toggleDropdown($event)" (closeDropdown)="closeDropdown()"
            (selectMes)="selectMes($event)" (selectAno)="selectAno($event)" (selectGrupo)="selectGrupo($event)"
            (setVista)="setVista($event)" (searchQueryChange)="searchQuery = $event; loadResumen()"
            (soloSinInformeChange)="onSoloSinInformeChange($event)">
         </app-informes-filters>
      </div>

      <!-- Resumen Sucursal Controls -->
      <div *ngIf="activeTab() === 'sucursal'"
         class="flex-1 min-w-0 max-w-full flex justify-start sm:justify-end overflow-visible relative z-20 mt-2 sm:mt-0">
         <div
            class="shrink-0 flex items-center gap-2 sm:gap-3 px-3 py-2 bg-white dark:bg-slate-900 rounded-2xl shadow-sm dark:shadow-md border border-brand-purple/40 dark:border-brand-purple/50 transition-colors">
            <!-- Backdrop para cerrar dropdown -->
            <div *ngIf="sucursalDropdownOpen" (click)="sucursalDropdownOpen = false" class="fixed inset-0 z-10 cursor-default"
               aria-hidden="true"></div>

            <!-- Período selector con navegación prev/next -->
            <div class="flex items-center gap-1 relative z-20 shrink-0">
               <!-- Flecha anterior -->
               <button type="button" (click)="navegarPeriodo(-1)"
                  title="Mes anterior" aria-label="Mes anterior"
                  class="w-9 h-9 md:w-11 md:h-11 flex items-center justify-center rounded-md md:rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-800 dark:hover:text-white transition-colors touch-manipulation">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                  </svg>
               </button>

               <div class="relative">
                  <button type="button" (click)="sucursalDropdownOpen = !sucursalDropdownOpen"
                     [attr.aria-expanded]="sucursalDropdownOpen" aria-haspopup="true"
                     class="min-w-[110px] touch-manipulation btn-secondary btn-sm">
                     <span class="truncate">{{ getMesLabel(selectedMes ?? '') }} {{ selectedAno }}</span>
                     <svg class="w-3.5 h-3.5 text-slate-400 transition-transform shrink-0"
                        [class.rotate-180]="sucursalDropdownOpen" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                     </svg>
                  </button>

                  <!-- Panel unificado Año + Mes -->
                  <div *ngIf="sucursalDropdownOpen"
                     class="absolute top-full right-0 mt-2 w-64 bg-white dark:bg-[#1e2030] rounded-xl shadow-xl border border-slate-200 dark:border-white/10 overflow-hidden flex divide-x divide-slate-100 dark:divide-white/5 animate-in fade-in slide-in-from-top-1 duration-150">
                     <!-- Columna Año -->
                     <div class="w-20 max-h-[16.5rem] overflow-y-auto p-1.5 flex flex-col gap-0.5" style="scrollbar-width: thin;">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center py-1 mb-1 border-b border-slate-100 dark:border-white/5">Año</p>
                        <button *ngFor="let a of anos" (click)="selectAno(a); sucursalDropdownOpen = false"
                           class="w-full px-1 py-1.5 rounded-md text-xs font-bold transition-all text-center"
                           [ngClass]="selectedAno === a ? 'bg-brand-purple text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5'">
                           {{ a }}
                        </button>
                     </div>
                     <!-- Columna Mes -->
                     <div class="flex-1 max-h-[16.5rem] overflow-y-auto p-1.5 flex flex-col gap-0.5" style="scrollbar-width: thin;">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider pl-2 py-1 mb-1 border-b border-slate-100 dark:border-white/5">Mes</p>
                        <div class="grid grid-cols-2 gap-1">
                           <button *ngFor="let m of meses" (click)="selectMes(m.value); sucursalDropdownOpen = false"
                              class="w-full text-left px-2 py-1.5 rounded-md text-xs font-medium transition-all truncate"
                              [ngClass]="selectedMes === m.value ? 'bg-brand-purple text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-white/5'">
                              {{ m.label }}
                           </button>
                        </div>
                     </div>
                  </div>
               </div>

               <!-- Flecha siguiente -->
               <button type="button" (click)="navegarPeriodo(1)"
                  title="Mes siguiente" aria-label="Mes siguiente"
                  class="w-9 h-9 md:w-11 md:h-11 flex items-center justify-center rounded-md md:rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-800 dark:hover:text-white transition-colors touch-manipulation">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                     <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                  </svg>
               </button>
            </div>

            <div class="w-px h-5 bg-slate-200 dark:bg-slate-700/60 shrink-0" aria-hidden="true"></div>

            <!-- Botón Enviar a Sucursal -->
            <button type="button" (click)="enviarInforme()" aria-label="Reportar a sucursal"
               [disabled]="!urlInformes()"
               [title]="urlInformes() ? 'Abrir informe en el sistema de la sucursal' : 'URL de sucursal no configurada'"
               class="h-9 md:h-11 flex items-center gap-1.5 px-3 rounded-lg text-xs font-display font-bold transition-colors active:scale-[0.97] active:transition-transform disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100 touch-manipulation"
               [ngClass]="urlInformes() ? 'bg-emerald-700 text-white hover:bg-emerald-800 shadow-md shadow-emerald-500/15 hover:shadow-lg hover:shadow-emerald-500/20' : 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-400'">
               <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
               </svg>
               <span class="hidden xl:inline">Reportar a sucursal</span>
            </button>

            <!-- Botón Imprimir -->
            <button type="button" (click)="imprimirSucursal()" aria-label="Imprimir resumen"
               class="touch-manipulation btn-primary btn-sm">
               <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                     d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
               </svg>
               <span class="hidden md:inline lg:hidden xl:inline">Imprimir</span>
            </button>
         </div>
      </div>
   </div>

   <!-- Tab Content -->
   <div
      class="flex-1 min-h-0 overflow-hidden flex flex-col print:!overflow-visible print:!h-auto print:block pt-1 md:pt-0">
      <!-- Tab 1: Entrada Mensual -->
      <div [ngClass]="activeTab() === 'entrada' ? 'flex flex-col gap-3 flex-1 min-h-0 overflow-hidden' : 'hidden'">
         <!-- Mes cerrado (marcado como enviado o cerrado solo): se puede corregir, pero solo cambia la tarjeta personal -->
         <app-aviso *ngIf="resumen()?.cierre" tone="success" [dense]="true" class="shrink-0 block">
            <strong>{{ resumen()?.cierre?.origen === 'automatico' ? 'Este mes se cerró solo.' : 'Este mes está marcado como enviado.' }}</strong>
            Los totales del mes quedaron guardados como estaban. Si corriges un informe, el cambio solo queda en la tarjeta de ese publicador.
         </app-aviso>
         <!-- Data List/Table Container -->
         <app-informes-table [resumen]="filteredResumen()" [canEdit]="canEditInformes()"
            [autoSaveStatus]="autoSaveStatus()" [hasPendingChanges]="hasPendingChanges()"
            [failedSaveCount]="failedSaveCount()"
            [privilegios]="privilegios()" [publicadorPrivilegiosMap]="publicadorPrivilegiosMap()"
            [localChanges]="localChanges" (informeChange)="handleInformeChange($event)"
            (notifyWhatsApp)="notificarWhatsApp($event)">
         </app-informes-table>
      </div>

      <!-- Tab 2: Historial -->
      <div [ngClass]="activeTab() === 'historial' ? 'flex-1 min-h-0 h-full flex flex-col' : 'hidden'">
         @if (canViewHistorial()) {
            <app-informes-historial [selectedAno]="anoServicioHistorial"
               [congregacionId]="congregacionContext.effectiveCongregacionId() ?? 0" [grupos]="grupos()"
               [canEdit]="canEditHistorial()" [canExport]="canViewHistorial()"
               [canExportResumenGrupo]="canExportResumenGrupo()"
               [lockedGroupId]="canViewHistorialAllGroups() ? null : historialGroupId()"
               class="h-full flex-col flex overflow-hidden">

               <div tabs class="w-full shrink-0">
                  <ng-container *ngTemplateOutlet="tabsNav"></ng-container>
               </div>
            </app-informes-historial>
         }
      </div>

      <!-- Tab 3: Resumen Sucursal -->
      <div [ngClass]="activeTab() === 'sucursal' ? 'flex-1 min-h-0 h-full flex flex-col overflow-y-auto' : 'hidden'">
         <app-resumen-sucursal [selectedMes]="selectedMes ?? ''" [selectedAno]="selectedAno ?? ''"
            [congregacionId]="congregacionContext.effectiveCongregacionId() ?? 0"
            [grupoId]="canViewResumenSucursalAllGroups() ? null : historialGroupId()"
            [showAsistencia]="canViewResumenSucursalAllGroups()"
            [puedeCerrar]="canViewResumenSucursalAllGroups()"
            [puedeReabrir]="isAdminOrSecretario()">
         </app-resumen-sucursal>
      </div>
   </div>
</div>
