<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Gestion y Administración de Congregaciones</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="favicon-64.png">

  <!-- Fuentes self-hosted: se precargan las dos familias que entran en el primer
       pintado para que el texto no aparezca con la fuente del sistema y salte
       despues. El atributo crossorigin es obligatorio en preload de fuentes,
       incluso siendo del mismo origen. -->
  <link rel="preload" as="font" type="font/woff2" href="fonts/manrope-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="fonts/urbanist-latin.woff2" crossorigin>

  <!-- Tema antes del primer pintado: evita el destello oscuro al abrir en tema claro. -->
  <script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
  <style>
    body, html { margin: 0; padding: 0; background-color: #f3f4f6; /* app-bg */ color: #334155; }
    html.dark, html.dark body { background-color: #020617; /* slate-950 */ color: white; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>

</html>
