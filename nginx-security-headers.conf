# Cabeceras de seguridad. Van en un archivo aparte porque nginx NO hereda los
# add_header del bloque server en una location que declara alguno propio: el
# `add_header Cache-Control` de `location = /index.html` dejaba el HTML de la
# app sin CSP, sin X-Frame-Options (clickjacking) y sin nosniff. Toda location
# con su propio add_header debe incluir este archivo.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP: además de 'self', lo que la app usa de verdad. blob: para las vistas
# previas de PDF/imagen (iframe e <img> con URL.createObjectURL); nominatim para
# el buscador de direcciones del mapa de territorios, que llama desde el
# navegador; https: en img-src por las teselas del mapa (OSM, Google).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
